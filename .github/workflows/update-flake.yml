name: nix-flake-update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'

permissions:
  contents: read

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # No owner or repositories given, so the token covers this repository
      # only.
      - name: generate app token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PROTO_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PROTO_PUBLISHER_APP_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Push as the app rather than GITHUB_TOKEN, whose pushes never
          # trigger further workflow runs, leaving the PR without checks.
          token: ${{ steps.app_token.outputs.token }}

      - name: install nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: update flake lock
        run: nix flake update

      - name: check for changes
        id: changes
        run: |
          if [[ -n $(git status --porcelain flake.lock) ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "flake.lock is already up to date"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.email noreply@cobaltspeech.com
          git config user.name Cobalt
          git checkout -B bot/flake-update
          git commit -am "chore: flake update $(date -I)"
          git push -u origin bot/flake-update --force

      - name: create pr
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if ! gh pr list --head bot/flake-update --state open \
              --json number --jq '.[0].number' | grep -q .; then
            gh pr create --base "${BASE}" --head bot/flake-update \
              --title "Automated flake lock update" \
              --body "Automated update of flake.lock."
          fi
