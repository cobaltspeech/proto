name: publish

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Never let two runs rewrite the downstream repositories at once.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gen-and-publish:
    name: gen-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # The publish script writes to other repositories, so GITHUB_TOKEN is
      # not enough. Scope the app token to just those repositories.
      - name: generate app token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.CI_PR_CREATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_PR_CREATOR_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            go-genproto
            py-genproto
            openapi-genproto
          permission-contents: write

      - name: checkout repo
        uses: actions/checkout@v7
        with:
          # Downstream pushes authenticate with the app token, not this one.
          persist-credentials: false
          # The publish script uses `git describe`.
          fetch-depth: 0

      - name: install nix
        uses: cachix/install-nix-action@v31.11.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: generate and publish
        env:
          GIT_AUTHOR_NAME: Cobalt
          GIT_AUTHOR_EMAIL: noreply@cobaltspeech.com
          GIT_COMMITTER_NAME: Cobalt
          GIT_COMMITTER_EMAIL: noreply@cobaltspeech.com
          TOKEN: ${{ steps.app_token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # Redirect the script's ssh clones to https with the app token.
          # Set through GIT_CONFIG_* rather than `git config --global` so the
          # token is not written to disk.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/${OWNER}/.insteadOf"
          export GIT_CONFIG_VALUE_0="git@github.com:${OWNER}/"
          nix develop -c ./bin/generate-and-publish.sh

  slack-notify:
    needs: gen-and-publish
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: notify slack
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            blocks:
              - type: header
                text:
                  type: plain_text
                  text: '🚨 Publish failed'
                  emoji: true
              - type: section
                text:
                  type: mrkdwn
                  text: '`${{ github.repository }}` failed to publish generated code for commit `${{ github.sha }}`.'
              - type: actions
                elements:
                  - type: button
                    text:
                      type: plain_text
                      text: View run
                      emoji: true
                    style: danger
                    url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
